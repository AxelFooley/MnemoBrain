version: 2
updates:
  # Dev dependencies from pyproject.toml [project.optional-dependencies]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  # GitHub Actions pins (checkout@v4, setup-python@v5)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

name: CodeQL

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  security-events: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only origin/"${{ github.base_ref }}"...HEAD > files.txt || true
          if [ ! -s files.txt ]; then echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -qvE '\.(md|rst|txt)$|^docs/|^\.github/(PULL_REQUEST|ISSUE)' files.txt; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
